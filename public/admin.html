<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GroceryGo | Admin Orders</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
/* --- Layout and Color Variables (Matching success.html) --- */
:root {
    --primary-color: #DC143C; /* Crimson */
    --secondary-color: #003893; /* Nepali Blue */
    --bg-color: #f8f9fa; /* Light Background */
    --text-color: #333;
    --card-bg: #fff;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Poppins', sans-serif; background: var(--bg-color); color: var(--text-color); line-height: 1.6; }

/* Header/Navigation styles */
header {background:linear-gradient(to right,var(--primary-color),var(--secondary-color));color:#fff;padding:15px 10px;text-align:center;position:sticky;top:0;z-index:1000;}
header h1{margin:0 0 5px 0;font-size:30px;font-weight:900;display:flex;justify-content:center;align-items:center;height:60px;}

.container{width:98%;max-width:1400px;margin:20px auto;}

/* --- Search Bar Styling --- */
.search-container {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    padding: 15px;
    background: var(--card-bg);
    border: 1px solid #ddd;
    border-radius: 8px; /* Slightly softer corners */
    box-shadow: 0 4px 8px rgba(0,0,0,0.05); /* Lighter shadow */
}
#searchInput {
    flex-grow: 1;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-size: 1em;
}
#searchButton {
    padding: 10px 15px;
    background-color: var(--secondary-color); /* Used Nepali Blue for Admin contrast */
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-weight: 600;
    transition: background-color 0.2s;
}
#searchButton:hover { background-color: #002873; }

/* --- Table Styling --- */
.table-container { 
    overflow-x: auto; 
    border: 1px solid #ddd; 
    border-radius: 8px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.05);
    background: var(--card-bg);
}
table{width:100%;border-collapse:collapse;margin:0; font-size: 0.9em;}
th,td{border-bottom:1px solid #eee;padding:12px 8px;text-align:left; border-right: none; border-left: none;}
th{background:var(--secondary-color);color:white; position: sticky; top: 0; z-index: 10; border-top-left-radius: 8px; border-top-right-radius: 8px; border-bottom: 2px solid white;} 
table { min-width: 1200px; } 

/* Status Badge Styles */
.status-badge {
    padding: 3px 8px;
    border-radius: 4px;
    font-weight: 600;
    font-size: 0.85em;
    display: inline-block;
}
.status-Processing { background-color: #ffc107; color: #333; }
.status-Shipped { background-color: #007bff; color: white; }
.status-Delivered { background-color: #28a745; color: white; }
.status-Cancelled { background-color: #dc3545; color: white; }
</style>
</head>
<body>
<header><h1>GroceryGo Admin Orders</h1></header>
<div class="container">
    
    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Search by Name, Postcode, Mobile, or Email...">
        <button id="searchButton">Search</button>
    </div>

    <div class="table-container">
        <table id="ordersTable">
            <thead>
                <tr>
                    <th>Order No</th>
                    <th>Date</th>
                    <th>Status</th>
                    <th>Total</th>
                    <th>Customer Name</th>
                    <th>Mobile</th>
                    <th>Delivery Address</th>
                    <th>Slot</th>
                    <th>Items (Qty)</th>
                </tr>
            </thead>
            <tbody><tr><td colspan="10">Loading orders...</td></tr></tbody>
        </table>
    </div>
</div>

<script type="module">
// FINAL RELIABLE SUPABASE IMPORT FIX
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/dist/module.js";

// Supabase config (USE YOUR ACTUAL KEYS)
const supabaseUrl = 'https://gikdqaxdqfmzdvolkxbn.supabase.co';
const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdpa2RxYXhkcWZtemR2b2xreGJuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjIyOTQwNDIsImV4cCI6MjA3Nzg3MDA0Mn0.pJ-9KfCxV7YT5loiURW14xRmf72s1EZRFRh4iKGnQis';
const supabase = createClient(supabaseUrl, supabaseKey);

// Global variable to store all fetched orders
let allOrders = [];

const tbody = document.querySelector('#ordersTable tbody');
const searchInput = document.getElementById('searchInput');
const searchButton = document.getElementById('searchButton');

/**
 * Renders the given array of order objects to the table body.
 * @param {Array} ordersToRender - The array of orders to display.
 */
function renderOrders(ordersToRender) {
    if (!ordersToRender || ordersToRender.length === 0) {
        tbody.innerHTML = `<tr><td colspan="10">No orders found.</td></tr>`;
        return;
    }

    tbody.innerHTML = '';
    ordersToRender.forEach(order => {
        const tr = document.createElement('tr');
        
        // 1. Process Items List
        const itemsArray = order.trolley || order.items || [];
        const itemsList = itemsArray.map(i => `${i.name || 'Item'} (x${i.quantity || 1})`).join('; ');

        // 2. Format Date
        const date = order.created_at ? new Date(order.created_at).toLocaleDateString() : 'N/A';

        // 3. Format Delivery Address
        const address = `${order.streetNo || ''} ${order.streetName || ''}, ${order.suburb || ''}, ${order.postcode || ''}`;
        
        // 4. Format Status Badge
        const status = order.status || 'Processing';
        const statusHtml = `<span class="status-badge status-${status.replace(/\s/g, '')}">${status}</span>`;

        // 5. Format Delivery Slot
        const slot = order.slot?.split('|')[1] || 'N/A';

        tr.innerHTML = `
            <td>${order.order_number || order.id || 'N/A'}</td> 
            <td>${date}</td>
            <td>${statusHtml}</td>
            <td>$${order.total?.toFixed(2) || '0.00'}</td> 
            <td>${order.name || ''}</td>
            <td>${order.mobile || ''}</td> 
            <td>${address}</td>
            <td>${slot}</td>
            <td>${itemsList}</td>
        `;
        tbody.appendChild(tr);
    });
}

/**
 * Searches the 'allOrders' array based on the input string.
 */
function searchOrders() {
    const searchTerm = searchInput.value.toLowerCase().trim();

    if (!searchTerm) {
        renderOrders(allOrders); // Show all orders if search bar is empty
        return;
    }

    const filteredOrders = allOrders.filter(order => {
        // Create a single searchable string from the required fields
        const searchableText = [
            order.name,
            order.postcode,
            order.mobile,
            order.email
        ].join('|').toLowerCase(); 

        return searchableText.includes(searchTerm);
    });

    renderOrders(filteredOrders);
}

/**
 * Initial function to fetch all orders from Supabase.
 */
async function loadOrders() {
    const { data: orders, error } = await supabase
        .from('orders')
        .select('*')
        .order('created_at', { ascending: false });

    if (error) {
        tbody.innerHTML = `<tr><td colspan="10">Error fetching orders: ${error.message}</td></tr>`;
        console.error('Supabase fetch error:', error);
        return;
    }

    // Store all orders globally and render them
    allOrders = orders;
    renderOrders(allOrders);
}

// Attach event listeners for search
searchButton.addEventListener('click', searchOrders);
searchInput.addEventListener('keyup', (event) => {
    // Optionally trigger search on Enter key
    if (event.key === 'Enter') {
        searchOrders();
    }
    // Automatically reset if the search box is cleared
    if (searchInput.value.trim() === '') {
        renderOrders(allOrders);
    }
});

loadOrders();
</script>
</body>
</html>
