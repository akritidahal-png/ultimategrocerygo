 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Order Confirmed</title>
<style>
body{font-family:sans-serif;background:#f8f9fa;color:#222;padding:20px;}
.container{max-width:600px;margin:50px auto;background:white;padding:20px;border-radius:8px;box-shadow:0 4px 6px rgba(0,0,0,0.1);}
h1{color:#DC143C;}
.summary-item{margin:10px 0;padding:6px 0;border-top:1px solid #eee;}
.btn{display:inline-block;padding:10px 15px;background:#003893;color:white;text-decoration:none;border-radius:6px;margin-top:15px;}
</style>
</head>
<body>
<div class="container">
<h1>Thanks — your order is confirmed</h1>
<p>We've received your order. Below is your order number and a short summary.</p>
<p>Order: <strong id="orderNumber">LOADING...</strong></p>
<div id="orderDetails">Loading...</div>
<a href="index.html" class="btn">Back to home — Continue shopping</a>
</div>

<script>
// Get order number from query param
const params = new URLSearchParams(window.location.search);
const orderNum = params.get('order');
document.getElementById('orderNumber').textContent = orderNum || 'N/A';

// Optionally, fetch order details from Supabase for this order
// e.g., supabase.from('orders').select('*').eq('order_number', orderNum)
document.getElementById('orderDetails').innerHTML = 'Order details will appear here (trolley summary can be fetched from Supabase).';
</script>
</body>
</html>
