<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Checkout - GroceryGo</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
  <script src="https://js.stripe.com/v3/"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.38.4/dist/umd/supabase.js"></script>
  <style>
    /* Style adjustments from index.html */
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      background: #f8f9fa;
      color: #212529;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }

    .wrap {
      width: 80%;
      max-width: 1100px;
      margin-top: 50px;
      background-color: #fff;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      border-radius: 8px;
      padding: 30px;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-weight: 600;
      font-size: 36px;
      color: #2c3e50;
      text-align: center;
      margin-bottom: 20px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header .logo {
      font-family: 'Playfair Display', serif;
      font-weight: 600;
      font-size: 28px;
      color: #2c3e50;
    }

    .header .cart {
      font-size: 18px;
      color: #f39c12;
      cursor: pointer;
    }

    .card {
      background-color: #ffffff;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
      margin-bottom: 20px;
    }

    .row {
      display: flex;
      gap: 15px;
      margin-bottom: 20px;
    }

    .col {
      flex: 1;
    }

    label {
      font-weight: 600;
      color: #2c3e50;
      margin-bottom: 8px;
      font-size: 14px;
    }

    input, select {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #ddd;
      font-size: 14px;
      background-color: #f9f9f9;
      margin-bottom: 15px;
      box-sizing: border-box;
      transition: all 0.3s ease;
    }

    input:focus, select:focus {
      border-color: #6c757d;
      background-color: #fff;
    }

    .error {
      color: #e74c3c;
      font-size: 14px;
      margin-top: 5px;
    }

    .pay-btn {
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      background-color: #f39c12;
      color: white;
      border: none;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 10px;
    }

    .pay-btn:hover {
      background-color: #e67e22;
    }

    .summary-line, .total-line {
      display: flex;
      justify-content: space-between;
      font-size: 16px;
      padding: 8px 0;
      border-bottom: 1px solid #ddd;
    }

    .summary-line:last-child, .total-line {
      font-weight: 700;
    }

    .total-line {
      font-size: 18px;
      padding-top: 10px;
      border-top: 2px solid #ddd;
    }

    footer {
      font-size: 12px;
      text-align: center;
      color: #6c757d;
      margin-top: 30px;
    }

    #card-element {
      background-color: #f8f9fa;
      border-radius: 8px;
      padding: 16px;
      border: 1px solid #ddd;
    }

    #payMessage {
      text-align: center;
      color: #27ae60;
      margin-top: 15px;
      font-size: 14px;
    }

    .small {
      font-size: 14px;
      color: #6c757d;
    }

    /* Error messages and warnings */
    #postcodeError {
      color: #e74c3c;
      font-size: 14px;
      margin-top: 10px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="header">
      <div class="logo">GroceryGo</div>
      <div class="cart">Your Cart</div>
    </header>

    <h1>Checkout</h1>

    <!-- Customer Details -->
    <div class="card">
      <label>Full name</label>
      <input id="name" type="text" placeholder="John Smith">

      <div class="row">
        <div class="col">
          <label>Mobile</label>
          <input id="mobile" type="text" placeholder="04xx xxx xxx">
        </div>
        <div class="col">
          <label>Email</label>
          <input id="email" type="email" placeholder="john@example.com">
        </div>
      </div>

      <label>Street address</label>
      <input id="address" type="text" placeholder="Street address, unit # (optional)">

      <div class="row">
        <div class="col">
          <label>Suburb</label>
          <input id="suburb" type="text" placeholder="Suburb">
        </div>
        <div class="col">
          <label>Postcode</label>
          <input id="postcode" type="text" placeholder="e.g. 4000">
          <div id="postcodeError">Sorry, we do not deliver to this postcode. Please enter a valid serviceable postcode.</div>
        </div>
        <div class="col">
          <label>State</label>
          <select id="state">
            <option value="QLD" selected>Queensland</option>
            <option value="NSW">New South Wales</option>
            <option value="VIC">Victoria</option>
            <option value="WA">Western Australia</option>
            <option value="SA">South Australia</option>
            <option value="TAS">Tasmania</option>
            <option value="NT">Northern Territory</option>
            <option value="ACT">Australian Capital Territory</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Delivery Slot and Summary -->
    <div class="card">
      <label>Delivery time slot</label>
      <select id="slotSelect">
        <option value="" disabled selected>Select a delivery slot</option>
      </select>

      <div class="summary-line">
        <div>Subtotal</div>
        <div id="subtotalText">$0.00</div>
      </div>
      <div class="summary-line">
        <div>Delivery fee</div>
        <div id="deliveryFee">$10.00</div>
      </div>
      <div class="total-line">
        <div>Total</div>
        <div id="totalText">$0.00</div>
      </div>
    </div>

    <!-- Payment -->
    <div class="card">
      <label>Card details</label>
      <div id="card-element"></div>
      <div id="payMessage"></div>
    </div>

    <button class="pay-btn" id="payBtn">Complete Payment</button>
    
    <footer>
      <p class="small">&copy; 2025 GroceryGo. All rights reserved.</p>
    </footer>
  </div>

  <script>
    const serviceablePostcodes = ["4000", "4064", "4075", "4101"]; // Example postcodes
    const zoneDeliveryTimes = {
      "4000": ["9:00 AM - 11:00 AM", "11:00 AM - 1:00 PM", "1:00 PM - 3:00 PM"],
      "4064": ["10:00 AM - 12:00 PM", "12:00 PM - 2:00 PM", "2:00 PM - 4:00 PM"],
      "4075": ["8:00 AM - 10:00 AM", "10:00 AM - 12:00 PM"],
      "4101": ["11:00 AM - 1:00 PM", "1:00 PM - 3:00 PM"]
    };

    const stripe = Stripe('your-publishable-key');
    const elements = stripe.elements();
    const card = elements.create('card');
    card.mount('#card-element');

    // Subtotal and total calculation
    let subtotal = 0;
    const cartItems = JSON.parse(localStorage.getItem('cartItems')) || [];
    cartItems.forEach(item => {
      subtotal += item.price * item.quantity;
    });

    const deliveryFee = 10.00;
    const total = subtotal + deliveryFee;

    document.getElementById('subtotalText').textContent = `$${subtotal.toFixed(2)}`;
    document.getElementById('totalText').textContent = `$${total.toFixed(2)}`;

    // Handle postcode input and validate serviceability
    document.getElementById('postcode').addEventListener('input', function() {
      const postcode = this.value.trim();
      const postcodeError = document.getElementById('postcodeError');
      const slotSelect = document.getElementById('slotSelect');

      if (serviceablePostcodes.includes(postcode)) {
        postcodeError.style.display = 'none';
        const availableSlots = zoneDeliveryTimes[postcode];
        slotSelect.innerHTML = availableSlots.map(time => `<option value="${time}">${time}</option>`).join('');
      } else {
        postcodeError.style.display = 'block';
        slotSelect.innerHTML = ''; // Clear slot options if postcode is not serviceable
      }
    });

    document.getElementById('payBtn').addEventListener('click', async () => {
      const name = document.getElementById('name').value;
      const mobile = document.getElementById('mobile').value;
      const email = document.getElementById('email').value;
      const address = document.getElementById('address').value;
      const suburb = document.getElementById('suburb').value;
      const postcode = document.getElementById('postcode').value;
      const state = document.getElementById('state').value;
      const deliverySlot = document.getElementById('slotSelect').value;

      if (!name || !mobile || !email || !address || !suburb || !postcode || !state || !deliverySlot) {
        alert('Please fill out all fields.');
        return;
      }

      // Create payment intent on the server (e.g., using Supabase function)
      const { data: paymentIntentData, error: paymentError } = await fetch('/create-payment-intent', {
        method: 'POST',
        body: JSON.stringify({ amount: total }),
        headers: { 'Content-Type': 'application/json' }
      }).then(res => res.json());

      if (paymentError) {
        console.error(paymentError);
        return;
      }

      const { client_secret } = paymentIntentData;

      const { error: stripeError } = await stripe.confirmCardPayment(client_secret, {
        payment_method: {
          card: card,
          billing_details: {
            name: name,
            email: email,
            phone: mobile,
            address: {
              line1: address,
              city: suburb,
              postal_code: postcode,
              state: state,
            }
          }
        }
      });

      if (stripeError) {
        document.getElementById('payMessage').textContent = `Payment failed: ${stripeError.message}`;
        return;
      }

      // After payment, save order to Supabase
      const { data, error } = await fetch('/create-order', {
        method: 'POST',
        body: JSON.stringify({
          name,
          mobile,
          email,
          address,
          suburb,
          postcode,
          state,
          total,
          deliverySlot,
          items: cartItems,
        }),
        headers: { 'Content-Type': 'application/json' }
      }).then(res => res.json());

      if (error) {
        console.error('Error saving order to Supabase:', error);
        return;
      }

      // Redirect to success page
      window.location.href = 'success.html';
    });
  </script>
</body>
</html>
