<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GroceryGo | Admin Orders</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap" rel="stylesheet">

<style>
  body { font-family: 'Poppins', sans-serif; margin:0; background:#f8f9fa; color:#222; }
  header { background:#003893; color:white; padding:15px; text-align:center; }
  h1 { margin:0; font-size:24px; }
  .container { width:95%; max-width:1200px; margin:20px auto; }

  #searchInput {
    padding:8px;
    width:300px;
    margin-bottom:10px;
    border:1px solid #ccc;
    border-radius:6px;
  }

  table {
    width:100%;
    border-collapse: collapse;
    background:white;
    border-radius:8px;
    overflow:hidden;
    box-shadow:0 4px 6px rgba(0,0,0,0.06);
  }

  th, td {
    padding:10px;
    border-bottom:1px solid #eee;
    text-align:left;
    font-size:0.9em;
  }

  th {
    background:#003893;
    color:white;
    font-weight:600;
  }

  tr:hover { background:#f1f1f1; }
</style>
</head>
<body>

<header>
  <h1>GroceryGo Admin Orders</h1>
</header>

<div class="container">
  <input type="text" id="searchInput" placeholder="Search by name or mobile">

  <table>
    <thead>
      <tr>
        <th>Order #</th>
        <th>Name</th>
        <th>Email</th>
        <th>Phone</th>
        <th>Total</th>
        <th>Delivery Slot</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody id="ordersBody"></tbody>
  </table>
</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

// YOUR REAL PROJECT (same as checkout)
const SUPABASE_URL = "https://gikdqaxdqfmzdvolkxbn.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdpa2RxYXhkcWZtemR2b2xreGJuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjIyOTQwNDIsImV4cCI6MjA3Nzg3MDA0Mn0.pJ-9KfCxV7YT5loiURW14xRmf72s1EZRFRh4iKGnQis";

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let ordersData = [];

async function loadOrders() {
  const { data, error } = await supabase
    .from("orders")
    .select("*")
    .order("created_at", { ascending: false });

  if (error) {
    console.error("Supabase Fetch Error:", error);
    return;
  }

  ordersData = data;
  renderOrders(data);
}

function renderOrders(list) {
  const table = document.getElementById("ordersBody");
  table.innerHTML = "";

  list.forEach(order => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${order.order_number}</td>
      <td>${order.customer_name}</td>
      <td>${order.email}</td>
      <td>${order.phone}</td>
      <td>$${Number(order.total_amount).toFixed(2)}</td>
      <td>${order.delivery_slot}</td>
      <td>${order.status || "Pending"}</td>
    `;
    table.appendChild(tr);
  });
}

// SEARCH
document.getElementById("searchInput").addEventListener("input", e => {
  const term = e.target.value.toLowerCase();
  const filtered = ordersData.filter(o =>
    o.customer_name?.toLowerCase().includes(term) ||
    o.phone?.toLowerCase().includes(term)
  );
  renderOrders(filtered);
});

// INITIAL LOAD
loadOrders();
</script>

</body>
</html>
