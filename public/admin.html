<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>GroceryGo | Admin Orders</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
/* keep same header/footer styles as other pages */
table{width:100%;border-collapse:collapse;margin-top:20px}
th, td{border:1px solid #ccc;padding:8px;text-align:left}
th{background:var(--nepali-blue);color:white}
</style>
</head>
<body>

<header>
  <h1>
    <div class="logo-container">
      <span class="logo-trolley-g">G<span class="logo-grocery-text">Grocery</span></span>
      <span class="logo-o">o</span>
    </div>
  </h1>
  <nav>
    <a href="index.html">HOME</a>
    <a href="store.html">STORE</a>
    <a href="about.html">ABOUT US</a>
    <a href="contact.html">CONTACT</a>
  </nav>
</header>

<div class="container">
  <h2>All Orders</h2>
  <table id="ordersTable">
    <thead>
      <tr>
        <th>Order #</th>
        <th>Customer</th>
        <th>Email</th>
        <th>Phone</th>
        <th>Total</th>
        <th>Delivery Slot</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody>
      <tr><td colspan="7">Loading...</td></tr>
    </tbody>
  </table>
</div>

<footer>© 2025 GroceryGo. All rights reserved.</footer>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

// --- Supabase details ---
const SUPABASE_URL = 'https://gikdqaxdqfmzdvolkxbn.supabase.co';
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdpa2RxYXhkcWZtemR2b2xreGJuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjIyOTQwNDIsImV4cCI6MjA3Nzg3MDA0Mn0.pJ-9KfCxV7YT5loiURW14xRmf72s1EZRFRh4iKGnQis";
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const tbody = document.querySelector('#ordersTable tbody');
tbody.innerHTML = '<tr><td colspan="7">Loading...</td></tr>';

const { data: orders, error } = await supabase
  .from('orders')
  .select('*')
  .order('created_at', { ascending: false });

if(error){
  tbody.innerHTML = `<tr><td colspan="7">Error loading orders</td></tr>`;
  console.error(error);
} else if(orders.length === 0){
  tbody.innerHTML = `<tr><td colspan="7">No orders found</td></tr>`;
} else {
  tbody.innerHTML = '';
  orders.forEach(o => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${o.order_number}</td>
      <td>${o.customer_name}</td>
      <td>${o.email}</td>
      <td>${o.phone}</td>
      <td>$${o.total_amount}</td>
      <td>${o.delivery_slot}</td>
      <td>${o.status}</td>
    `;
    tbody.appendChild(tr);
  });
}
</script>

</body>
</html>
