      <span class="logo-o">o</span>

<div class="container">
  <h2>Thanks — Your Order is Confirmed!</h2>
  <p>We've received your order. Your order number is shown below for reference:</p>
  <div class="order-number" id="orderNumber">Loading...</div>
  <p>Your order details will be emailed to you shortly.</p>
  <a href="index.html" class="btn-home">Back to Home — Continue Shopping</a>
</div>

<footer>© 2025 GroceryGo. All rights reserved.</footer>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

// --- Supabase details ---
const SUPABASE_URL = 'https://gikdqaxdqfmzdvolkxbn.supabase.co';
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdpa2RxYXhkcWZtemR2b2xreGJuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjIyOTQwNDIsImV4cCI6MjA3Nzg3MDA0Mn0.pJ-9KfCxV7YT5loiURW14xRmf72s1EZRFRh4iKGnQis";
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// Get pid from URL
const urlParams = new URLSearchParams(window.location.search);
const pid = urlParams.get('pid');
const orderNumberEl = document.getElementById('orderNumber');

if(!pid){
  orderNumberEl.textContent = 'Order number not found';
} else {
  const { data, error } = await supabase
    .from('orders')
    .select('order_number')
    .eq('stripe_id', pid)
    .single();

  if(error || !data){
    orderNumberEl.textContent = 'Error fetching order number';
    console.error(error);
  } else {
    orderNumberEl.textContent = data.order_number;
  }
}
</script>
</body>
