<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GroceryGo | Admin Orders</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
body{font-family:'Poppins',sans-serif;margin:0;background:#f8f9fa;color:#222;}
header{background:#003893;color:white;padding:15px;text-align:center;}
h1{margin:0;font-size:24px;}
.container{width:95%;max-width:1200px;margin:20px auto;}
input{padding:8px;width:100%;max-width:300px;margin-bottom:15px;border:1px solid #ccc;border-radius:6px;}
table{width:100%;border-collapse:collapse;background:white;border-radius:8px;overflow:hidden;box-shadow:0 4px 6px rgba(0,0,0,0.06);}
th,td{padding:10px;text-align:left;border-bottom:1px solid #eee;font-size:0.9em;}
th{background:#003893;color:white;position:sticky;top:0;}
tr:nth-child(even){background:#f4f4f4;}
</style>
</head>
<body>
<header>
<h1>GroceryGo Admin Orders</h1>
</header>

<div class="container">
<input type="text" id="searchInput" placeholder="Search by name or mobile...">
<table id="ordersTable">
<thead>
<tr>
<th>ID</th>
<th>Name</th>
<th>Mobile</th>
<th>Email</th>
<th>Address</th>
<th>Slot</th>
<th>Subtotal</th>
<th>Delivery Fee</th>
<th>Total</th>
<th>Status</th>
<th>Items</th>
</tr>
</thead>
<tbody></tbody>
</table>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

const SUPABASE_URL = 'https://YOUR_SUPABASE_PROJECT_URL';
const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const tableBody = document.querySelector('#ordersTable tbody');
const searchInput = document.getElementById('searchInput');

async function fetchOrders(){
  const { data, error } = await supabase.from('orders').select('*').order('id', {ascending:false});
  if(error) return console.error(error);
  displayOrders(data);
}

function displayOrders(orders){
  tableBody.innerHTML='';
  orders.forEach(o=>{
    const tr = document.createElement('tr');
    const address = `${o.unit?o.unit+', ':''}${o.streetNo} ${o.streetName}, ${o.suburb} ${o.postcode}, ${o.state}`;
    const items = JSON.parse(o.trolley||'[]').map(i=>`${i.name} x${i.quantity}`).join(', ');
    tr.innerHTML=`
      <td>${o.id}</td>
      <td>${o.name}</td>
      <td>${o.mobile}</td>
      <td>${o.email}</td>
      <td>${address}</td>
      <td>${o.slot}</td>
      <td>$${o.subtotal.toFixed(2)}</td>
      <td>$${o.deliveryFee.toFixed(2)}</td>
      <td>$${o.total.toFixed(2)}</td>
      <td>${o.status}</td>
      <td>${items}</td>
    `;
    tableBody.appendChild(tr);
  });
}

// Search filter
searchInput.addEventListener('input', ()=>{
  const term = searchInput.value.toLowerCase();
  const rows = tableBody.querySelectorAll('tr');
  rows.forEach(r=>{
    const name = r.cells[1].textContent.toLowerCase();
    const mobile = r.cells[2].textContent.toLowerCase();
    r.style.display = (name.includes(term) || mobile.includes(term)) ? '' : 'none';
  });
});

fetchOrders();
</script>
</body>
</html>
