<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>GroceryGo | Store</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --primary-color:#DC143C;
  --secondary-color:#003893;
  --highlight-color:#FFD700;
  --bg-color:#f8f9fa;
  --text-color:#222;
  --border-color:#ddd;
}
*{box-sizing:border-box;}
body{font-family:'Poppins',sans-serif;margin:0;background:var(--bg-color);color:var(--text-color);line-height:1.5;}
header{background:linear-gradient(to right,var(--primary-color),var(--secondary-color));color:#fff;padding:10px;text-align:center;position:sticky;top:0;z-index:1000;}
header h1{margin:0;font-size:24px;font-weight:900;display:flex;justify-content:center;align-items:center;height:50px;}
nav{margin-top:5px;display:flex;flex-wrap:wrap;justify-content:center;}
nav a{color:white;text-decoration:none;margin:5px 10px;font-weight:600;font-size:14px;}
nav a:hover{text-decoration:underline;}
.header-tools{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;margin-top:10px;gap:10px;}
.search-wrap{flex:1;display:flex;position:relative;min-width:180px;}
#headerSearch{width:100%;padding:8px 12px;border:none;border-radius:6px;font-size:14px;}
#headerSearchSuggestions{border:1px solid var(--border-color);border-radius:0 0 6px 6px;max-height:200px;overflow-y:auto;background:white;position:absolute;width:100%;display:none;z-index:120;color:var(--text-color);box-shadow:0 4px 6px rgba(0,0,0,0.12);top:100%;}
#headerSearchSuggestions div{padding:6px 10px;cursor:pointer;}
#headerSearchSuggestions div:hover{background:var(--highlight-color);color:#000;}
#trolleyIcon{cursor:pointer;font-size:16px;font-weight:700;display:flex;align-items:center;padding:5px 8px;border:2px solid var(--highlight-color);border-radius:6px;background:rgba(255,255,255,0.08);transition:0.2s;}
#trolleyIcon:hover{background:rgba(255,255,255,0.14);}
#trolleyCount{background:var(--highlight-color);color:var(--text-color);padding:1px 6px;border-radius:50%;margin-left:6px;font-size:12px;font-weight:900;}

.container{width:95%;max-width:1200px;margin:15px auto;padding:5px;}
.category-btn {
  padding: 5px 12px;
  font-size: 13px;
  font-weight: 600;
  border: none;
  border-radius: 6px;
  background: teal;       /* Changed from primary-color to teal */
  color: white;
  cursor: pointer;
  transition: 0.2s;
}

.category-btn:hover {
  background: #006d6d;   /* Slightly darker teal for hover */
}

#productGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;}

.product-card{background:white;padding:10px;border-radius:8px;box-shadow:0 4px 8px rgba(0,0,0,0.06);text-align:center;display:flex;flex-direction:column;justify-content:space-between;transition:transform 0.2s, box-shadow 0.2s;min-height:300px;}
.product-card:hover{transform:translateY(-3px);box-shadow:0 6px 12px rgba(0,0,0,0.1);}
.product-image-container{height:140px;width:100%;display:flex;justify-content:center;align-items:center;}
.product-card img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px;}
.product-info{text-align:left;margin-top:8px;flex-grow:1;}
.product-name{font-weight:600;margin:2px 0;font-size:14px;min-height:30px;}
.product-brand{color:#555;font-size:0.8em;margin-bottom:4px;display:block;}
.product-price{font-size:1em;font-weight:700;color:var(--primary-color);margin-bottom:5px;display:block;}
.add-to-cart-btn{width:100%;margin-top:6px;padding:8px 10px;border-radius:6px;font-size:14px;background:var(--primary-color);color:white;border:none;cursor:pointer;transition:0.2s;}
.add-to-cart-btn:hover{background:var(--secondary-color);}
#centerToast{display:none;position:fixed;top:18px;left:50%;transform:translateX(-50%);background:var(--secondary-color);color:white;padding:8px 12px;border-radius:6px;z-index:999;font-weight:700;text-align:center;}
footer{background:var(--secondary-color);color:white;text-align:center;padding:12px 0;font-size:14px;margin-top:25px;}

@media(max-width:600px){
  header h1{font-size:20px;height:45px;}
  #headerSearch{font-size:13px;padding:6px 10px;}
  #productGrid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;}
  .product-card{min-height:260px;padding:8px;}
  .product-name{font-size:13px;}
  .add-to-cart-btn{font-size:13px;padding:6px 8px;}
  .category-btn{font-size:12px;padding:4px 10px;}
}
</style>
</head>
<body>

<header>
  <h1>GroceryGo</h1>
  <nav>
    <a href="index.html">HOME</a>
    <a href="store.html">STORE</a>
    <a href="about.html">ABOUT US</a>
    <a href="contact.html">CONTACT</a>
  </nav>
  <div class="header-tools">
    <div class="search-wrap">
      <input id="headerSearch" placeholder="🔍 Search products..." autocomplete="off">
      <div id="headerSearchSuggestions"></div>
    </div>
    <div id="trolleyIcon" onclick="window.location.href='trolley.html'"> 🛒 <span id="trolleyCount">0</span></div>
  </div>
</header>

<div class="container">
  <div class="categories">
    <button class="category-btn" data-cat="">All Products</button>
    <button class="category-btn" data-cat="hot_deals">Hot Deals</button>
    <button class="category-btn" data-cat="newly_arrived">Newly Arrived</button>
    <button class="category-btn" data-cat="authentic">Authentic</button>
    <button class="category-btn" data-cat="rice and grains">Rice & Grains</button>
    <button class="category-btn" data-cat="snacks">Snacks</button>
    <button class="category-btn" data-cat="pulses">Pulses</button>
    <button class="category-btn" data-cat="dairy">Dairy</button>
    <button class="category-btn" data-cat="veggies">Veggies</button>
    <button class="category-btn" data-cat="miscellaneous">Miscellaneous</button>
  </div>
  <div id="productGrid"></div>
</div>

<footer>© 2025 GroceryGo. All rights reserved.</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://gikdqaxdqfmzdvolkxbn.supabase.co";
const SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdpa2RxYXhkcWZtemR2b2xreGJuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjIyOTQwNDIsImV4cCI6MjA3Nzg3MDA0Mn0.pJ-9KfCxV7YT5loiURW14xRmf72s1EZRFRh4iKGnQis"; // replace with your key
const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const LS_TROLLEY="grocerygo_trolley";
let trolley=JSON.parse(localStorage.getItem(LS_TROLLEY))||[];
let products=[];

function updateTrolleyCount(){document.getElementById("trolleyCount").textContent=trolley.reduce((s,i)=>s+i.quantity,0);}
function saveTrolley(){localStorage.setItem(LS_TROLLEY,JSON.stringify(trolley));updateTrolleyCount();}
function showToast(msg){let t=document.getElementById("centerToast");if(!t){t=document.createElement("div");t.id="centerToast";document.body.appendChild(t);}t.textContent=msg;t.style.display="block";setTimeout(()=>t.style.display='none',1500);}
function addToTrolley(p,v,price){const existing=trolley.find(i=>i.id===p.id&&i.variant===v);if(existing){existing.quantity++;}else{trolley.push({id:p.id,name:p.Item||p.name,brand:p.brand||'',variant:v,price,quantity:1});}saveTrolley();showToast(`${p.Item||p.name}${v?` (${v})`:''} added!`);}

function renderProducts(list){
  const grid=document.getElementById("productGrid");
  grid.innerHTML="";
  list.forEach(p=>{
    if(typeof p.variants==="string") p.variants=JSON.parse(p.variants||'[]');
    if(typeof p.placeholder_images==="string") p.placeholder_images=JSON.parse(p.placeholder_images||'[]');
    const price=p.variants?.[0]?.price||p.price||0;
    const img=p.placeholder_images?.[0]||"https://via.placeholder.com/300x200?text=No+Image";
    const card=document.createElement("div");
    card.className="product-card";
    card.innerHTML=`
      <div class="product-image-container"><img src="${img}"></div>
      <div class="product-info">
        <span class="product-name">${p.Item||p.name}</span>
        <span class="product-brand">${p.brand||''}</span>
        <span class="product-price">$${price.toFixed(2)}</span>
        ${p.variants?.length ? `<select class="product-variant">
          ${p.variants.map(v=>`<option value="${v.name}">${v.name} — $${Number(v.price).toFixed(2)}</option>`).join('')}
        </select>`:''}
      </div>
      <button class="add-to-cart-btn">Add to Trolley</button>
    `;
    card.querySelector(".add-to-cart-btn").onclick=()=>{
      const v=card.querySelector(".product-variant")?.value||p.variants?.[0]?.name||"";
      const vp=p.variants?.find(x=>x.name===v)?.price||price;
      addToTrolley(p,v,Number(vp));
    };
    grid.appendChild(card);
  });
}

async function loadProducts(){
  const tables=["hot_deals","newly_arrived","authentic","items","products"];
  let all=[];
  for(const t of tables){
    const {data,error}=await supabaseClient.from(t).select("*");
    if(error){console.error(error);continue;}
    all.push(...(data||[]));
  }

  // Deduplicate by name and merge variants/images
  const seen = new Map();
  products = all.filter(p=>{
    const name=(p.Item||p.name||'').toLowerCase().trim();
    if(!name) return false;

    if(seen.has(name)){
      const existing=seen.get(name);
      // Merge variants
      if(p.variants){
        try{
          const variants=typeof p.variants==='string'?JSON.parse(p.variants):p.variants;
          existing.variants=[...(existing.variants||[]),...variants].filter((v,i,arr)=>arr.findIndex(x=>x.name===v.name)===i);
        }catch{}
      }
      // Merge images
      if(p.placeholder_images){
        try{
          const imgs=typeof p.placeholder_images==='string'?JSON.parse(p.placeholder_images):p.placeholder_images;
          existing.placeholder_images=[...(existing.placeholder_images||[]),...imgs].filter((img,i,arr)=>arr.indexOf(img)===i);
        }catch{}
      }
      return false;
    }

    seen.set(name,p);
    return true;
  });

  const q=new URLSearchParams(window.location.search).get('q')?.toLowerCase();
  if(q){
    const filtered=products.filter(p=>(p.Item||p.name).toLowerCase().includes(q)||(p.brand||'').toLowerCase().includes(q));
    renderProducts(filtered);
  }else renderProducts(products);
}

document.addEventListener("DOMContentLoaded",()=>{
  updateTrolleyCount();
  loadProducts();
});

// CATEGORY FILTER
document.querySelectorAll(".category-btn").forEach(btn=>{
  btn.addEventListener("click",()=>{
    const cat=btn.dataset.cat.toLowerCase();
    if(!cat){renderProducts(products);return;}
    const filtered=products.filter(p=>{
      if(cat==='hot_deals') return p.hot_deal;
      if(cat==='newly_arrived') return p.newly_arrived;
      if(cat==='authentic') return p.authentic;
      return (p.category||'').toLowerCase()===cat;
    });
    renderProducts(filtered);
  });
});

// SEARCH SUGGESTIONS
const searchInput=document.getElementById('headerSearch');
const suggestionBox=document.getElementById('headerSearchSuggestions');
searchInput.addEventListener('input',()=>{
  const q=searchInput.value.trim().toLowerCase();
  suggestionBox.innerHTML="";
  if(!q){suggestionBox.style.display='none';return;}
  const matches=products.filter(p=>(p.Item||p.name).toLowerCase().includes(q)||(p.brand||'').toLowerCase().includes(q));
  matches.slice(0,10).forEach(p=>{
    const div=document.createElement('div');
    div.textContent=(p.Item||p.name)+(p.brand?` (${p.brand})`: '');
    div.onclick=()=>{window.location.href=`store.html?q=${encodeURIComponent(q)}`;};
    suggestionBox.appendChild(div);
  });
  suggestionBox.style.display=matches.length?'block':'none';
});
document.addEventListener('click',e=>{if(!searchInput.contains(e.target)&&!suggestionBox.contains(e.target)) suggestionBox.style.display='none';});
</script>

</body>
</html>
